<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语学习工作台</title><link rel="stylesheet" href="preview.css"><link rel="stylesheet" href="interaction-example.css"><link rel="stylesheet" href="shadowing-example.css"><link rel="stylesheet" href="today-practice.css"><link rel="stylesheet" href="today-choice.css"><link rel="stylesheet" href="vocab-example.css"><link rel="stylesheet" href="progress-example.css"><link rel="stylesheet" href="workbench.css"><link rel="stylesheet" href="features21.css"><link rel="stylesheet" href="features21-revision.css"></head><body>
<div id="workspace-shell"><header class="site-header"><a class="brand" href="#today"><span class="brand-mark">阅</span>英语学习工作台</a><span class="preview-label">本地工作台 · 2.1 本地版</span></header>

<div class="sync-bar"><button id="upload-data" type="button">上传学习数据</button><button id="download-data" type="button">下载学习数据</button><button id="view-conflicts" type="button">同步记录</button><span id="sync-state" role="status">连接中…</span></div>
<main><div id="course-picker"></div><div id="workspace"><p role="status">正在读取本地教材…</p></div><p id="app-status" role="status" aria-live="polite"></p></main></div>
<div id="level-modal" class="modal-backdrop" hidden>
<section class="level-dialog" id="level-dialog" role="dialog" aria-modal="true" aria-labelledby="test-title" tabindex="-1">
<header class="test-header"><div><div class="section-eyebrow">MONTHLY ASSESSMENT / 水平测试</div><h2 id="test-title">月度水平测试</h2><p>听说读写独立保存 · 提交后由 Muse 批改</p></div><button type="button" id="close-test" class="close-test" aria-label="关闭水平测试">×</button></header>
<p id="test-message" class="test-preview-note" role="status">读取 Muse 测试包…</p>
<label class="test-pack-label">测试包 <select id="test-pack-picker"></select></label><div id="test-real-body"><div class="test-tabs" role="tablist" aria-label="测试四项">
<button type="button" role="tab" id="tab-listening" aria-controls="panel-listening" aria-selected="true" data-test-tab="listening">01 <span>听力</span></button>
<button type="button" role="tab" id="tab-speaking" aria-controls="panel-speaking" aria-selected="false" tabindex="-1" data-test-tab="speaking">02 <span>口语</span></button>
<button type="button" role="tab" id="tab-reading" aria-controls="panel-reading" aria-selected="false" tabindex="-1" data-test-tab="reading">03 <span>阅读</span></button>
<button type="button" role="tab" id="tab-writing" aria-controls="panel-writing" aria-selected="false" tabindex="-1" data-test-tab="writing">04 <span>写作</span></button>
</div>
<div class="test-content" id="real-test-content"></div>
<div id="test-submitted-state" class="test-submitted-state" role="status" hidden><span>◌</span><div><strong>已提交，待 Muse 批改</strong><p>已保存到本机。请上传学习数据，供 Muse 读取作答和录音；已有评分可下载取回。</p></div></div>
<footer class="test-footer"><div class="test-pagination"><button type="button" class="quiet-button" id="previous-section" disabled>上一项</button><button type="button" class="quiet-button" id="next-section">下一项 →</button></div><button type="button" id="real-test-submit" class="assessment-submit">提交本次测试</button><a href="#progress" id="go-real-test-results" hidden>查看独立测试记录 →</a></footer></div>
</section>
</div>
<section id="combined-card" class="combined-card" role="dialog" aria-modal="false" aria-labelledby="card-title" tabindex="-1" hidden>
<div class="card-top"><span id="card-kicker">WORD ＋ SENTENCE</span><button type="button" id="close-card" aria-label="关闭卡片">×</button></div>
<section id="word-section"><div class="word-title-row"><h2 id="card-title" lang="en"></h2><button type="button" id="demo-word-pronounce" class="word-pronounce" aria-label="播放单词发音" aria-busy="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><span>发音</span></button></div><p id="word-pronunciation-status" role="status" aria-live="polite"></p><p class="meaning-placeholder">词性与本句中文义由 Muse 下发<br><span>本样例不填充示例释义</span></p><button type="button" id="demo-add" class="card-primary">加入生词</button></section>
<section id="sentence-section"><div class="sentence-heading"><span id="sentence-label">所在句子</span><span id="sentence-number"></span></div><p id="sentence-quote" lang="en"></p><div class="sentence-actions"><button type="button" id="demo-play">▷ 播放本句</button><button type="button" id="demo-translate" aria-expanded="false">显示翻译</button><button type="button" id="demo-flag" aria-pressed="false">标记没懂</button></div><p id="translation-placeholder" hidden>本句中文翻译由 Muse 下发后显示在这里。</p></section>
